server:
  port: 10000  # 网关端口，所有外部请求统一走这个端口

spring:
  application:
    name: gateway

  cloud:
    # Nacos 配置
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace:   # 和你其他服务保持一致
      config:
        import-check:
          enabled: false

    # Gateway 核心配置
    gateway:
      # 开启基于服务发现的动态路由
      discovery:
        locator:
          enabled: true          # 开启后，网关自动从 Nacos 拉取服务列表
          lower-case-service-id: true  # 服务名转小写，避免大小写匹配问题

      # 自定义路由规则
      routes:
        # 路由1：用户服务
        - id: user-service-route
          uri: lb://user-service   # lb:// 表示负载均衡，从 Nacos 获取实例列表
          predicates:
            - Path=/api/user/**    # 匹配以 /api/user/ 开头的请求
          filters:
            - StripPrefix=1        # 去掉1级前缀：/api/user/1 → /user/1

        # 路由2：订单服务
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

      # 全局跨域配置（前后端分离必备）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              -  "*"
            allowed-methods:
              -  "*"
            allowed-headers:
              -  "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      enabled: true
    health:
      enabled: true
resilience4j:
  circuitbreaker:
    instances:
      userServiceCircuitBreaker:   # 必须和路由中 name 一致
        failure-rate-threshold: 50          # 失败率超过50%触发熔断
        minimum-number-of-calls: 5          # 最少调用5次才开始统计
        wait-duration-in-open-state: 10s    # 熔断后等待10秒进入半开状态
        permitted-number-of-calls-in-half-open-state: 3  # 半开状态允许3个探测请求
        sliding-window-size: 10             # 滑动窗口大小
        sliding-window-type: COUNT_BASED    # 按请求次数统计
  timelimiter:
    instances:
      userServiceCircuitBreaker:
        timeout-duration: 3s                # 下游响应超过3秒算超时