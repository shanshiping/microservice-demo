server:
  port: 10000  # 网关端口，所有外部请求统一走这个端口

spring:
  application:
    name: gateway

  cloud:
    # Nacos 配置
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace:   # 和你其他服务保持一致

    # Gateway 核心配置
    gateway:
      # 开启基于服务发现的动态路由
      discovery:
        locator:
          enabled: true          # 开启后，网关自动从 Nacos 拉取服务列表
          lower-case-service-id: true  # 服务名转小写，避免大小写匹配问题

      # 自定义路由规则
      routes:
        # 路由1：用户服务
        - id: user-service-route
          uri: lb://user-service   # lb:// 表示负载均衡，从 Nacos 获取实例列表
          predicates:
            - Path=/api/user/**    # 匹配以 /api/user/ 开头的请求
          filters:
            - StripPrefix=1        # 去掉1级前缀：/api/user/1 → /user/1

        # 路由2：订单服务
        - id: order-service-route
          uri: lb://order-service
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

      # 全局跨域配置（前后端分离必备）
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              -  "*"
            allowed-methods:
              -  "*"
            allowed-headers:
              -  "*"
            allowCredentials: true